<svg width="460" height="160" viewBox="0 0 460 160" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>array. logo</title>
<desc>Wordmark "array" in navy with a bracket-and-dot mark representing an array data structure, in navy and azure blue.</desc>

<!-- Mark: bracket [ ] with accent dot, evoking "array[.]" -->
<g transform="translate(30,30)">
  <!-- left bracket -->
  <path d="M18 0 H4 a4 4 0 0 0 -4 4 V96 a4 4 0 0 0 4 4 H18"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right bracket -->
  <path d="M82 0 H96 a4 4 0 0 1 4 4 V96 a4 4 0 0 1 -4 4 H82"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- accent element (dot / array cell) -->
  <rect x="38" y="38" width="24" height="24" rx="5" fill="#1E6FE8"/>
</g>

<!-- Wordmark -->
<text x="182" y="102" font-family="'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">array</text>
<!-- period rendered as accent square to echo the mark -->
<rect x="390" y="79" width="16" height="16" rx="3" fill="#1E6FE8"/>
</svg>


